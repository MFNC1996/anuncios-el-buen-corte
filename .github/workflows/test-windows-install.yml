name: Probar instalador en Windows real

# Corre el instalador en una maquina Windows real (un runner de GitHub Actions,
# Windows Server, no una simulacion). Arma el mismo paquete que build-installer.sh
# (app + Node portable + los .bat/.vbs) y corre INSTALAR.bat tal cual lo haria
# un usuario con doble clic, para confirmar que el servidor realmente levanta,
# que los accesos directos quedan creados y que se puede detener. No pasa por
# la ventana del instalador .exe (requiere un clic humano en "Si"), pero usa
# exactamente el mismo contenido y los mismos scripts que el .exe extrae y
# ejecuta.

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      # Deliberadamente NO se usa actions/setup-node aca: eso agregaria un
      # Node al PATH del runner para TODO el job, y taparia justo el bug real
      # que esto tiene que detectar (el PC del local no tiene node en el PATH
      # fuera de la carpeta portatil que trae el instalador).

      - name: Descargar Node.js portable (el mismo que usa el instalador)
        shell: pwsh
        run: |
          $ver = "20.20.2"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$ver/node-v$ver-win-x64.zip" -OutFile node-portable.zip
          Expand-Archive node-portable.zip -DestinationPath .
          Rename-Item "node-v$ver-win-x64" node-runtime

      - name: "Verificar que los comandos no se rompen con espacios en la ruta (perfil tipo \"Juan Perez\")"
        shell: pwsh
        run: |
          $spaceDir = "$env:RUNNER_TEMP\Carpeta Con Espacio"
          New-Item -ItemType Directory -Force -Path $spaceDir | Out-Null
          Copy-Item "node-runtime\npm.cmd" "$spaceDir\npm.cmd"
          Copy-Item "node-runtime\node.exe" "$spaceDir\node.exe"
          Copy-Item -Recurse "node-runtime\node_modules" "$spaceDir\node_modules" -ErrorAction SilentlyContinue

          $testLines = @(
            'const { spawnSafe } = require(process.cwd() + "\\server\\spawn-safe.js");',
            'const path = require("path");',
            'const child = spawnSafe(path.join(process.argv[2], "npm.cmd"), ["--version"]);',
            'let out = "";',
            'child.stdout.on("data", (d) => (out += d));',
            'child.on("close", (code) => {',
            '  console.log("EXIT:" + code);',
            '  console.log("OUT:" + out.trim());',
            '});'
          )
          Set-Content -Path "test-spawn-safe.js" -Value $testLines

          $result = & "node-runtime\node.exe" test-spawn-safe.js "$spaceDir" | Out-String
          Write-Host $result
          if ($result -notmatch 'EXIT:0') { throw "spawnSafe fallo con una ruta que tiene espacios: $result" }
          Write-Host "OK: spawnSafe funciona con rutas que tienen espacios"
          Remove-Item "test-spawn-safe.js"

      - name: Descargar el instalador del SDK de Tizen y Android Platform Tools (igual que el instalador real)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.tizen.org/sdk/Installer/tizen-studio_6.0/web-cli_Tizen_Studio_6.0_windows-64.exe" -OutFile tizen-studio-installer.exe
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath .

      - name: Armar el paquete (igual contenido que build-installer.sh)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\app | Out-Null
          robocopy . package\app /E /XD .git node_modules "server\data" "tizen-app\.build" windows-installer .claude .github package /XF *.db *.db-wal *.db-shm .DS_Store
          if ($LASTEXITCODE -ge 8) { throw "robocopy del codigo de la app fallo (codigo $LASTEXITCODE)" }
          $global:LASTEXITCODE = 0 # robocopy devuelve 1-7 en casos exitosos; sin esto el step se marca como fallido igual
          New-Item -ItemType Directory -Force -Path package\app\server\uploads | Out-Null
          New-Item -ItemType File -Force -Path package\app\server\uploads\.gitkeep | Out-Null
          Move-Item node-runtime package\node-runtime
          Move-Item platform-tools package\platform-tools
          Move-Item tizen-studio-installer.exe package\tizen-studio-installer.exe
          Copy-Item windows-installer\INSTALAR.bat package\
          Copy-Item windows-installer\DESINSTALAR.bat package\
          Copy-Item windows-installer\start-hidden.vbs package\
          Copy-Item windows-installer\stop-server.vbs package\
          Copy-Item windows-installer\make-shortcuts.ps1 package\
          Copy-Item windows-installer\reinstalar-dependencias.bat package\
          Copy-Item windows-installer\instalar-tizen-studio.bat package\
          Copy-Item windows-installer\LEEME.txt package\

      - name: Generar app.ico (igual que make-icon.js, solo la parte del icono)
        shell: pwsh
        run: |
          # Usa el Node portatil (ya movido a package\node-runtime) a proposito,
          # para no tener que agregar ningun node al PATH global del runner.
          & "package\node-runtime\npm.cmd" install --no-fund --no-audit png-to-ico
          & "package\node-runtime\node.exe" -e "require('png-to-ico').default('public/shared/brand/logo.png').then(buf => require('fs').writeFileSync('package/app.ico', buf))"

      - name: Correr INSTALAR.bat como lo haria un usuario real (doble clic)
        shell: cmd
        working-directory: package
        run: |
          INSTALAR.bat < nul

      - name: Verificar accesos directos y registro
        shell: pwsh
        run: |
          $installDir = "$env:LOCALAPPDATA\CarteleraElBuenCorte"
          $checks = @(
            "$env:USERPROFILE\Desktop\Cartelera El Buen Corte.lnk",
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Cartelera El Buen Corte\Cartelera El Buen Corte.lnk",
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Cartelera El Buen Corte\Detener Cartelera.lnk",
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Cartelera El Buen Corte\Desinstalar.lnk",
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\Cartelera El Buen Corte.lnk",
            "$installDir\node_modules",
            "$installDir\node_modules\better-sqlite3\build\Release\better_sqlite3.node",
            "$installDir\app.ico",
            "$installDir\instalar-tizen-studio.bat",
            "$installDir\tizen-studio-installer.exe",
            "$installDir\platform-tools\adb.exe"
          )
          foreach ($c in $checks) {
            if (-not (Test-Path $c)) { throw "Falta: $c" }
            Write-Host "OK: $c"
          }
          $reg = Get-ItemProperty -Path HKCU:\Software\CarteleraElBuenCorte -ErrorAction Stop
          Write-Host "OK: registro InstallDir = $($reg.InstallDir)"

      - name: "Verificar que los accesos directos funcionan con espacios en la ruta (perfil tipo \"Juan Perez\")"
        shell: pwsh
        run: |
          # Los .lnk ya existen porque el runner no tiene espacio en su perfil
          # (no hubiera alcanzado para detectar este bug real: el acceso
          # directo se CREABA igual, pero con la ruta guardada en "Arguments"
          # sin comillas, asi que al abrirlo wscript.exe la partia en dos
          # argumentos justo cuando el perfil de Windows tiene un espacio en
          # el nombre). Se prueba aparte, armando accesos directos sobre una
          # carpeta con espacio y confirmando que "Arguments" queda citado.
          $spaceDir = "$env:RUNNER_TEMP\Carpeta Con Espacio"
          $startMenuDir = "$spaceDir\StartMenu"
          $startupDir = "$spaceDir\Startup"
          $desktopDir = "$spaceDir\Desktop"
          New-Item -ItemType Directory -Force -Path $spaceDir, $startMenuDir, $startupDir, $desktopDir | Out-Null
          New-Item -ItemType File -Force -Path "$spaceDir\start-hidden.vbs" | Out-Null

          & "windows-installer\make-shortcuts.ps1" -InstallDir $spaceDir -StartMenuDir $startMenuDir -StartupDir $startupDir -DesktopDir $desktopDir -AppName "Cartelera El Buen Corte"

          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut("$startupDir\Cartelera El Buen Corte.lnk")
          Write-Host "Arguments guardados: $($lnk.Arguments)"
          if ($lnk.Arguments -notmatch '^".*\.vbs"$') {
            throw "El acceso directo no quedo con la ruta entre comillas: $($lnk.Arguments)"
          }
          if (-not (Test-Path ($lnk.Arguments -replace '^"|"$',''))) {
            throw "La ruta citada no apunta al archivo real: $($lnk.Arguments)"
          }
          Write-Host "OK: los accesos directos funcionan con espacios en la ruta"

      - name: Verificar que el servidor realmente levanto
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri http://localhost:4010/admin -UseBasicParsing -TimeoutSec 3
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ok) { throw "El panel admin no respondio en http://localhost:4010/admin" }
          Write-Host "OK: /admin respondio 200"

          $tizen = Invoke-RestMethod -Uri http://localhost:4010/api/tizen/check -TimeoutSec 15
          Write-Host "OK: /api/tizen/check respondio -> $($tizen | ConvertTo-Json -Compress)"
          if ($null -eq $tizen.ready) { throw "/api/tizen/check no devolvio el campo 'ready'" }
          if (-not $tizen.canAutoInstallSdk) { throw "canAutoInstallSdk deberia ser true (el .exe del SDK viene incluido)" }

          $info = Invoke-RestMethod -Uri http://localhost:4010/api/server-info -TimeoutSec 5
          Write-Host "OK: /api/server-info respondio -> ip=$($info.ip)"

          $android = Invoke-RestMethod -Uri http://localhost:4010/api/android/check -TimeoutSec 5
          Write-Host "OK: /api/android/check respondio -> $($android | ConvertTo-Json -Compress)"
          if (-not $android.ready) { throw "adb deberia estar listo (platform-tools viene incluido)" }

          $scan = Invoke-RestMethod -Uri http://localhost:4010/api/network/scan -TimeoutSec 15
          Write-Host "OK: /api/network/scan respondio -> $($scan.devices.Count) dispositivo(s)"

      - name: Instalar el SDK de Tizen de verdad (boton real del panel) en Windows real
        shell: pwsh
        run: |
          Invoke-RestMethod -Method Post -Uri http://localhost:4010/api/tizen/install-sdk -TimeoutSec 5 | Out-Null

          # Hay que esperar a que el trabajo termine del todo (busy=false), no solo
          # a que "tizen"/"sdb" respondan: install-sdk sigue corriendo despues de eso
          # (crea el certificado de firma), y romper antes deja al siguiente chequeo
          # (el .p12) corriendo en una carrera contra ese paso todavia en curso.
          # El servidor se da por vencido solo a los 40 min (SDK_INSTALL_TIMEOUT_MS
          # en tizen.js, subido de 12 a 25 a 40 porque las dos veces anteriores el
          # SDK de Tizen tardo mas de lo esperado bajando paquetes en este runner) —
          # este loop tiene que esperar MAS que eso. 550 x 5s = ~46 min.
          $finished = $false
          for ($i = 0; $i -lt 550; $i++) {
            try {
              $status = Invoke-RestMethod -Uri http://localhost:4010/api/tizen/check -TimeoutSec 15
              if (-not $status.busy) { $finished = $true; break }
            } catch {}
            Start-Sleep -Seconds 5
          }
          if (-not $finished) {
            Write-Host "---- server\data\tizen.log ----"
            Get-Content "$env:LOCALAPPDATA\CarteleraElBuenCorte\server\data\tizen.log" -ErrorAction SilentlyContinue | Write-Host
            throw "install-sdk no termino despues de ~46 minutos"
          }

          $status = Invoke-RestMethod -Uri http://localhost:4010/api/tizen/check -TimeoutSec 15
          if (-not $status.ready) {
            Write-Host "---- server\data\tizen.log ----"
            Get-Content "$env:LOCALAPPDATA\CarteleraElBuenCorte\server\data\tizen.log" -ErrorAction SilentlyContinue | Write-Host
            throw "install-sdk termino pero tizen/sdb no quedaron listos"
          }
          Write-Host "OK: SDK de Tizen instalado y detectado por /api/tizen/check"

          $certPath = "$env:USERPROFILE\tizen-studio-data\keystore\author\ebcorte.p12"
          if (-not (Test-Path $certPath)) {
            Write-Host "---- server\data\tizen.log ----"
            Get-Content "$env:LOCALAPPDATA\CarteleraElBuenCorte\server\data\tizen.log" -ErrorAction SilentlyContinue | Write-Host
            throw "No se creo el certificado de firma esperado: $certPath"
          }
          Write-Host "OK: certificado de firma creado"

          # "ready" y el .p12 ya estaban bien antes de que se descubriera este
          # bug (el ultimo paso, cli-config, fallaba siempre en Windows y
          # dejaba la instalacion entera marcada como fallida) — ninguno de
          # los dos chequeos de arriba lo habria detectado. La unica senal de
          # que install-sdk termino de verdad sin tirar error en NINGUN paso
          # es esta linea final, que solo se imprime si el for loop de
          # ensureCertificateAndProfile (certificado + perfil + cli-config)
          # no lanzo ninguna excepcion no manejada.
          $log = Get-Content "$env:LOCALAPPDATA\CarteleraElBuenCorte\server\data\tizen.log" -ErrorAction SilentlyContinue
          $listoCount = ($log | Select-String 'Listo\. Ya puedes usar').Count
          if ($listoCount -lt 1) {
            Write-Host "---- server\data\tizen.log ----"
            $log | Write-Host
            throw "install-sdk no llego al mensaje final de exito — algun paso (certificado/perfil/cli-config) fallo sin que los chequeos de arriba lo detectaran"
          }
          Write-Host "OK: install-sdk termino de verdad sin error en ningun paso"

      - name: Apretar "Instalar herramientas de Tizen" una segunda vez (reproduce el caso real reportado desde el local)
        shell: pwsh
        run: |
          # Caso real: alguien aprieta el boton "por si acaso" con el SDK ya
          # instalado de antes. Antes del fix esto fallaba porque el
          # instalador de Samsung rechaza una carpeta que ya existe y el
          # certificado ya estaba creado ("Already exist the specified
          # filename") — y el servidor reportaba eso como un error fatal
          # aunque no habia nada roto. Esta vez debe terminar rapido (sin
          # volver a correr el instalador real de ~300MB) y sin error.
          Invoke-RestMethod -Method Post -Uri http://localhost:4010/api/tizen/install-sdk -TimeoutSec 5 | Out-Null

          $finished = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $status = Invoke-RestMethod -Uri http://localhost:4010/api/tizen/check -TimeoutSec 15
              if (-not $status.busy) { $finished = $true; break }
            } catch {}
            Start-Sleep -Seconds 5
          }
          $log = Get-Content "$env:LOCALAPPDATA\CarteleraElBuenCorte\server\data\tizen.log" -ErrorAction SilentlyContinue
          if (-not $finished) {
            Write-Host "---- server\data\tizen.log ----"
            $log | Write-Host
            throw "La segunda vuelta de install-sdk no termino en ~5 minutos (deberia ser casi instantanea)"
          }

          $status = Invoke-RestMethod -Uri http://localhost:4010/api/tizen/check -TimeoutSec 15
          Write-Host "---- server\data\tizen.log (segunda vuelta) ----"
          $log | Write-Host
          if (-not $status.ready) {
            throw "Tras la segunda vuelta, tizen/sdb dejaron de estar listos"
          }
          if (-not ($log -match 'ya estaba instalado y funcionando')) {
            throw "No se detecto el mensaje de 'SDK ya instalado' — se habra vuelto a correr el instalador de nuevo?"
          }
          if (-not ($log -match 'ya estaba configurado de antes')) {
            throw "No se detecto el mensaje de certificado ya existente — la segunda vuelta no fue idempotente"
          }
          # Tiene que haber un SEGUNDO "Listo" nuevo (no solo el de la primera
          # vuelta) — si cli-config (u otro paso) fallara esta vez, el log
          # seguiria teniendo el "Listo" de la instalacion original y este
          # chequeo lo pasaria por alto si solo buscara "al menos uno".
          $listoCount = ($log | Select-String 'Listo\. Ya puedes usar').Count
          if ($listoCount -lt 2) {
            throw "La segunda vuelta no llego a su propio mensaje final de exito (solo se encontro $listoCount, se esperaban 2) — algun paso fallo sin que los chequeos de arriba lo detectaran"
          }
          Write-Host "OK: segunda vuelta de install-sdk fue idempotente, sin error"

      - name: Preparar una version "vieja" para probar el actualizador
        shell: pwsh
        run: |
          $installDir = "$env:LOCALAPPDATA\CarteleraElBuenCorte"
          wscript "$installDir\stop-server.vbs"
          Start-Sleep -Seconds 3
          if (Get-Process node -ErrorAction SilentlyContinue) { throw "node.exe seguia corriendo, no se pudo bajar la version para la prueba" }

          $pkgPath = "$installDir\package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = "1.0.0"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content $pkgPath

          "FOTO DE PRUEBA - NO DEBE BORRARSE" | Set-Content "$installDir\server\uploads\foto-prueba.txt"
          "BASE DE DATOS DE PRUEBA - NO DEBE BORRARSE" | Set-Content "$installDir\server\data\marcador-prueba.db"

          wscript "$installDir\start-hidden.vbs"
          Start-Sleep -Seconds 3

      - name: Buscar y aplicar la actualizacion real (como lo haria el boton del panel)
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            try {
              $check = Invoke-RestMethod -Uri http://localhost:4010/api/update/check -TimeoutSec 3
              $ok = $true; break
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) { throw "El servidor con la version vieja no respondio" }
          Write-Host "Check -> $($check | ConvertTo-Json -Compress)"
          if ($check.currentVersion -ne "1.0.0") { throw "currentVersion esperado 1.0.0, vino $($check.currentVersion)" }
          if (-not $check.updateAvailable) { throw "updateAvailable deberia ser true" }

          Invoke-RestMethod -Method Post -Uri http://localhost:4010/api/update/apply -TimeoutSec 5 | Out-Null

          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri http://localhost:4010/admin -UseBasicParsing -TimeoutSec 3
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) {
            $installDir = "$env:LOCALAPPDATA\CarteleraElBuenCorte"
            Write-Host "---- server\data\update.log ----"
            Get-Content "$installDir\server\data\update.log" -ErrorAction SilentlyContinue | Write-Host
            throw "El servidor no volvio a responder despues de actualizar"
          }
          Write-Host "OK: el servidor volvio a responder tras actualizar"

          $after = Invoke-RestMethod -Uri http://localhost:4010/api/update/check -TimeoutSec 5
          Write-Host "Check post-actualizacion -> $($after | ConvertTo-Json -Compress)"
          if ($after.currentVersion -eq "1.0.0") { throw "La version no cambio tras actualizar" }

      - name: Verificar que la actualizacion no borro fotos ni datos guardados
        shell: pwsh
        run: |
          $installDir = "$env:LOCALAPPDATA\CarteleraElBuenCorte"
          if (-not (Test-Path "$installDir\server\uploads\foto-prueba.txt")) { throw "La actualizacion borro una foto guardada" }
          if (-not (Test-Path "$installDir\server\data\marcador-prueba.db")) { throw "La actualizacion borro datos guardados" }
          if (-not (Test-Path "$installDir\node_modules\better-sqlite3\build\Release\better_sqlite3.node")) { throw "better-sqlite3 no quedo compilado tras el npm install de la actualizacion" }
          Write-Host "OK: fotos y datos guardados siguen intactos despues de actualizar"

      - name: Detener el servidor (ya actualizado) y verificar que se apaga
        shell: pwsh
        run: |
          $installDir = "$env:LOCALAPPDATA\CarteleraElBuenCorte"
          wscript "$installDir\stop-server.vbs"
          Start-Sleep -Seconds 3
          $p = Get-Process node -ErrorAction SilentlyContinue
          if ($p) { throw "node.exe seguia corriendo despues de stop-server.vbs" }
          Write-Host "OK: el servidor se detuvo"

      - name: Logs del servidor (por si algo falla)
        if: always()
        shell: pwsh
        run: |
          $installDir = "$env:LOCALAPPDATA\CarteleraElBuenCorte"
          Write-Host "---- server\data\update.log ----"
          Get-Content "$installDir\server\data\update.log" -ErrorAction SilentlyContinue | Write-Host
          Write-Host "---- server\data\tizen.log ----"
          Get-Content "$installDir\server\data\tizen.log" -ErrorAction SilentlyContinue | Write-Host
          Write-Host "---- Contenido de $installDir ----"
          if (Test-Path $installDir) { Get-ChildItem -Recurse $installDir | Select-Object FullName | Out-String | Write-Host }
