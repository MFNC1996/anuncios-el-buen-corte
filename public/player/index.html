<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>El Buen Corte — Cartelera</title>
  <link rel="icon" type="image/png" href="/shared/brand/logo.png" />
  <link rel="stylesheet" href="/shared/brand.css" />
  <link rel="stylesheet" href="/shared/animations.css" />
  <link rel="stylesheet" href="/shared/templates.css" />
  <link rel="stylesheet" href="/player-assets/player.css" />
</head>
<body>
  <script>
    // Diagnóstico temporal: en la TV real no hay forma de ver la consola, así
    // que cualquier error se escribe directo en la pantalla para poder leerlo
    // con una foto. Se puede quitar una vez resuelto el problema de pantalla
    // en blanco en la TV Samsung.
    function showFatalError(msg) {
      var el = document.createElement('div');
      el.style.cssText = 'position:fixed;inset:0;background:#b00020;color:#fff;font:16px monospace;padding:16px;white-space:pre-wrap;z-index:99999;overflow:auto;';
      el.textContent = 'ERROR: ' + msg;
      document.body.appendChild(el);
    }
    window.addEventListener('error', function (e) {
      showFatalError((e.message || 'error desconocido') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      showFatalError('promise rechazada: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
  </script>
  <div id="stage" class="slide-stage">
    <div id="stage-header" class="board-header" hidden>
      <img class="logo-mini" src="/shared/brand/logo.png" alt="" />
      <h2 id="stage-title"></h2>
    </div>
    <div id="slide-area" class="slide-area"></div>
  </div>
  <script src="/shared/util.js"></script>
  <script src="/player-assets/player.js"></script>
</body>
</html>
